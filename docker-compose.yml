# Local development database for FitVerse.
# Production uses MongoDB Atlas; this container only runs on your machine.
name: fit-verse

services:
  mongodb:
    image: mongo:8
    container_name: fit-verse-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fit-verse-backend
    init: true
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env.development
    environment:
      MONGO_URI: mongodb://mongodb:27017/fit-verse
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
